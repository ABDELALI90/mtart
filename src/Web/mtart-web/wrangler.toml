# MT ART public site (Cloudflare Pages + D1)
name = "mtart-web"
compatibility_date = "2026-08-01"
pages_build_output_dir = "dist"

# Binding name must stay DB to match the Cloudflare dashboard.
# Replace database_id with the UUID from: npx wrangler d1 info mtart-db
[[d1_databases]]
binding = "DB"
database_name = "mtart-db"
database_id = "19c67cbf-5936-4268-b038-6241027788f7"
migrations_dir = "migrations"

# Contact form secrets belong in the Cloudflare dashboard or `.dev.vars`, not here:
#   RESEND_API_KEY, CONTACT_TO_EMAIL, CONTACT_FROM_EMAIL
# Remaining non-catalog write APIs still proxy via RAILWAY_API_BASE_URL.
[vars]
RAILWAY_API_BASE_URL = "https://mtart-production.up.railway.app"